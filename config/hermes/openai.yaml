# Text-only integration profile. Hermes inherits the existing root OAuth grant.
model:
  provider: openai-codex
  default: gpt-5.6-sol
agent:
  coding_context: off
platform_toolsets:
  cli: []
fallback_model: null
fallback_providers: []
compression:
  enabled: false
memory:
  memory_enabled: false
  user_profile_enabled: false
auxiliary:
  title_generation:
    enabled: false
  background_review:
    enabled: false
