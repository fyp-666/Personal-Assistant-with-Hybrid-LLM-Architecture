[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "hybrid-assistant"
version = "0.1.0"
description = "Project-owned components for a Hermes-based personal assistant."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "google-api-python-client>=2.170,<3",
    "google-auth-oauthlib>=1.2,<2",
]

[project.scripts]
hybrid-assistant = "cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/app", "src/features", "src/adapters", "src/cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
