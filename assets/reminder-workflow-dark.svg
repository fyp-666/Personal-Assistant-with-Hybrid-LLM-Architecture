<svg xmlns="http://www.w3.org/2000/svg" width="900" height="168" viewBox="0 0 900 168" role="img" aria-labelledby="title desc">
<title id="title">Independent calendar reminder worker</title><desc id="desc">Without model calls, the reminder worker syncs calendar events, rechecks due events, claims each delivery in a SQLite ledger, delivers through Telegram, and records the outcome.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#8b949e"/></marker></defs>
<defs><mask id="label-gaps" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="168"><rect width="900" height="168" fill="white"/></mask></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf3} .main{font-size:18px} .detail{font-size:16px;fill:#b1bac4} .edge{font-size:15px;fill:#b1bac4}</style>
<polyline mask="url(#label-gaps)" points="218,66 240,66" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline mask="url(#label-gaps)" points="438,66 460,66" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline mask="url(#label-gaps)" points="658,66 680,66" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="26" width="198" height="80" rx="3" fill="#161b22" stroke="#6e7681" stroke-width="1.4"/>
<text x="119.0" y="58.0" text-anchor="middle" class="main">Sync calendar</text>
<text x="119.0" y="84.0" text-anchor="middle" class="detail">Google Calendar API</text>
<rect x="240" y="26" width="198" height="80" rx="3" fill="#161b22" stroke="#6e7681" stroke-width="1.4"/>
<text x="339.0" y="58.0" text-anchor="middle" class="main">Recheck due events</text>
<text x="339.0" y="84.0" text-anchor="middle" class="detail">Current time / version</text>
<rect x="460" y="26" width="198" height="80" rx="3" fill="#161b22" stroke="#6e7681" stroke-width="1.4"/>
<text x="559.0" y="58.0" text-anchor="middle" class="main">Claim delivery</text>
<text x="559.0" y="84.0" text-anchor="middle" class="detail">SQLite delivery ledger</text>
<rect x="680" y="26" width="198" height="80" rx="3" fill="#19251f" stroke="#7e9587" stroke-width="1.4"/>
<text x="779.0" y="58.0" text-anchor="middle" class="main">Deliver and record</text>
<text x="779.0" y="84.0" text-anchor="middle" class="detail">Telegram outcome</text>
<text x="450" y="147" text-anchor="middle" class="detail">No model calls. Confirmed and uncertain delivery outcomes are retained.</text>
</svg>
