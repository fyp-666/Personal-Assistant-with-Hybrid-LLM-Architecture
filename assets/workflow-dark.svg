<rect x="315" y="24" width="270" height="44" rx="22.0" fill="#161b22" stroke="#6e7681" stroke-width="1.4"/>
<text x="450.0" y="52.0" text-anchor="middle" class="main">CLI / Telegram request</text>
<rect x="295" y="106" width="310" height="76" rx="3" fill="#161b22" stroke="#6e7681" stroke-width="1.4"/>
<text x="450.0" y="136.0" text-anchor="middle" class="main">Build request context</text>
<text x="450.0" y="162.0" text-anchor="middle" class="detail">History, preferences, time, tools</text>
<rect x="295" y="210" width="310" height="76" rx="3" fill="#161b22" stroke="#6e7681" stroke-width="1.4"/>
<text x="450.0" y="240.0" text-anchor="middle" class="main">Select permitted model</text>
<text x="450.0" y="266.0" text-anchor="middle" class="detail">Active provider, privacy, limits</text>
<rect x="295" y="318" width="310" height="76" rx="3" fill="#1b2430" stroke="#7d8fa3" stroke-width="1.4"/>
<text x="450.0" y="348.0" text-anchor="middle" class="main">One model decision via Hermes</text>
<text x="450.0" y="374.0" text-anchor="middle" class="detail">Validate structured JSON</text>
<polygon points="450,422.0 540.0,486 450,550.0 360.0,486" fill="#1b2430" stroke="#7d8fa3" stroke-width="1.4"/>
<text x="450" y="479" text-anchor="middle" class="main">Decision</text>
<text x="450" y="504" text-anchor="middle" class="main">branch</text>
<rect x="66" y="594" width="200" height="72" rx="3" fill="#211e29" stroke="#93889f" stroke-width="1.4"/>
<text x="166.0" y="622.0" text-anchor="middle" class="main">Authorize NVIDIA</text>
<text x="166.0" y="648.0" text-anchor="middle" class="detail">reasoning handoff</text>
<rect x="650" y="390" width="224" height="74" rx="37.0" fill="#161b22" stroke="#6e7681" stroke-width="1.4"/>
<text x="762.0" y="419.0" text-anchor="middle" class="main">Stop and report</text>
<text x="762.0" y="445.0" text-anchor="middle" class="detail">Confirmed outcomes only</text>
<rect x="295" y="594" width="310" height="72" rx="3" fill="#161b22" stroke="#6e7681" stroke-width="1.4"/>
<text x="450.0" y="622.0" text-anchor="middle" class="main">Validate tool request</text>
<text x="450.0" y="648.0" text-anchor="middle" class="detail">Goal, arguments, ID / version</text>
<rect x="295" y="698" width="310" height="72" rx="3" fill="#161b22" stroke="#6e7681" stroke-width="1.4"/>
<text x="450.0" y="726.0" text-anchor="middle" class="main">Execute business tool</text>
<text x="450.0" y="752.0" text-anchor="middle" class="detail">Gmail / Google Calendar</text>
<rect x="295" y="798" width="310" height="60" rx="3" fill="#161b22" stroke="#6e7681" stroke-width="1.4"/>
<text x="450.0" y="834.0" text-anchor="middle" class="main">Checkpoint confirmed result</text>
<polygon points="450,884.0 540.0,948 450,1012.0 360.0,948" fill="#1b2430" stroke="#7d8fa3" stroke-width="1.4"/>
<text x="450" y="941" text-anchor="middle" class="main">Requested</text>
<text x="450" y="966" text-anchor="middle" class="main">result mode</text>
<rect x="295" y="1046" width="310" height="54" rx="3" fill="#161b22" stroke="#6e7681" stroke-width="1.4"/>
<text x="450.0" y="1079.0" text-anchor="middle" class="main">Render confirmed result</text>
<rect x="295" y="1140" width="310" height="50" rx="25.0" fill="#19251f" stroke="#7e9587" stroke-width="1.4"/>
<text x="450.0" y="1171.0" text-anchor="middle" class="main">Save conversation and reply</text>
<text x="480" y="412" text-anchor="middle" class="edge">Valid</text>
<text x="450" y="575" text-anchor="middle" class="edge">Tool request</text>
<text x="166" y="537" text-anchor="middle" class="edge">Reasoning</text>
<text x="168" y="234" text-anchor="middle" class="edge">Same context and budgets</text>
<text x="774" y="509" text-anchor="middle" class="edge">Answer / clarify</text>
<text x="746" y="342" text-anchor="middle" class="edge">Invalid / unavailable</text>
<text x="151" y="130" text-anchor="middle" class="edge">continue: new evidence</text>
<text x="450" y="1032" text-anchor="middle" class="edge">direct</text>
<line x1="85" y1="1220" x2="815" y2="1220" stroke="#30363d"/>
<text x="450" y="1243" text-anchor="middle" class="detail">Limits, blocked operations, and failed or unconfirmed work use the same stop policy:</text>
<text x="450" y="1267" text-anchor="middle" class="detail">keep confirmed outcomes, report what happened, and never replay writes automatically.</text>
</svg>
