<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1280" viewBox="0 0 900 1280" role="img" aria-labelledby="title desc">
<title id="title">Agent decision and execution workflow</title><desc id="desc">A bounded branch-and-loop workflow with provider policy, structured decisions, an NVIDIA handoff, validated tools, checkpoints, direct results, and a continue loop. Failure handling preserves confirmed outcomes.</desc>
